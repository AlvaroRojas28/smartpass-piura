<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal del pasajero · SmartPass Piura</title>
  <link rel="stylesheet" href="/FrontEnd/css/styles.css">
</head>
<body>
  <header><h1>Portal del pasajero · <span id="usuarioActual"></span></h1><button onclick="cerrarSesion()">Salir</button></header>
  <main>
    <div class="tarjeta">
      <h2>Mi saldo</h2>
      <div class="saldo" id="saldo">S/ 0.00</div>
    </div>

    <div class="tarjeta">
      <h2>Recargar saldo (simulado)</h2>
      <div class="fila">
        <div><label for="monto">Monto (S/)</label><input id="monto" type="number" min="1" step="0.50" value="10"></div>
        <div><label for="metodo">Método de pago simulado</label>
          <select id="metodo"><option>Efectivo (agente)</option><option>Tarjeta</option><option>Billetera digital</option></select></div>
      </div>
      <button class="principal" id="btnRecargar" type="button">Confirmar recarga</button>
      <div id="msgRecarga" class="msg"></div>
    </div>

    <div class="tarjeta">
      <h2>Mi código QR</h2>
      <div class="qr-caja">
        <div id="qr"></div>
        <small>Muestra este código al cobrador al abordar. Se renueva cada vez que lo actualizas.</small>
        <button class="principal" id="btnQR" type="button" style="max-width:260px;">Actualizar código</button>
      </div>
    </div>

    <div class="tarjeta">
      <h2>Historial de viajes</h2>
      <table><thead><tr><th>Fecha</th><th>Hora</th><th>Unidad</th><th>Ruta</th><th>Monto</th></tr></thead>
      <tbody id="historial"></tbody></table>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pasajero.js"></script>
</body>
</html>
