<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPass Piura</title>
  <link rel="stylesheet" href="/FrontEnd/css/styles.css">
</head>
<body>
  <header><h1>SmartPass Piura · Empresa de Transporte Sol de Piura</h1></header>
  <main>
    <div class="tarjeta" style="max-width:420px;margin:24px auto;">
      <h2>Iniciar sesión</h2>
      <nav class="tabs">
        <button id="tabPasajero" class="activa" type="button">Pasajero</button>
        <button id="tabPersonal" type="button">Cobrador / Administrador</button>
      </nav>
      <label for="dni">DNI</label>
      <input id="dni" maxlength="8" inputmode="numeric" autocomplete="username">
      <label for="clave">Clave</label>
      <input id="clave" type="password" autocomplete="current-password">
      <button class="principal" id="btnIngresar" type="button">Ingresar</button>
      <div id="msg" class="msg"></div>
      <p id="enlaceRegistro" style="text-align:center;margin-bottom:0;">¿Aún no tienes cuenta? <a href="/registro.html">Regístrate</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script>
    let modo = 'pasajero';
    function elegir(m) {
      modo = m;
      document.getElementById('tabPasajero').className = m === 'pasajero' ? 'activa' : '';
      document.getElementById('tabPersonal').className = m === 'personal' ? 'activa' : '';
      document.getElementById('enlaceRegistro').style.display = m === 'pasajero' ? 'block' : 'none';
    }
    document.getElementById('tabPasajero').onclick = () => elegir('pasajero');
    document.getElementById('tabPersonal').onclick = () => elegir('personal');
    document.getElementById('btnIngresar').onclick = async () => {
      try {
        const ruta = modo === 'pasajero' ? '/api/auth/login' : '/api/auth/login-personal';
        const datos = await api(ruta, { method: 'POST', body: JSON.stringify({
          dni: document.getElementById('dni').value.trim(),
          clave: document.getElementById('clave').value }) });
        guardarSesion(datos);
        const destino = { PASAJERO: '/pasajero.html', COBRADOR: '/validar.html', ADMINISTRADOR: '/admin.html' };
        window.location.href = destino[datos.rol] || '/index.html';
      } catch (e) { mostrarMensaje('msg', e.message, 'error'); }
    };
  </script>
</body>
</html>
