spring.application.name=smartpass-piura
server.port=${PORT:8080}

# --- Base de datos (variables de entorno para no exponer credenciales en el repositorio) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartpass}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:2808}

# --- Creacion de tablas y datos de prueba al iniciar (scripts idempotentes) ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# --- Reglas del piloto ---
smartpass.tarifa-pasaje=${TARIFA_PASAJE:1.80}
smartpass.jwt.secret=${JWT_SECRET:cambie-este-secreto-por-uno-de-al-menos-32-caracteres}
smartpass.jwt.expiracion-minutos=${JWT_MINUTOS:480}
